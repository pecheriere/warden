[workspace]
resolver = "3"
members = ["crates/proto", "crates/broker", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pecheriere/warden"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
# Internal crates
warden-broker-proto = { path = "crates/proto", version = "0.2.0" }
warden-broker = { path = "crates/broker", version = "0.2.0" }

# Async runtime and web
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "fs", "io-util"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
async-trait = "0.1.92"
http = "1.5.0"
url = { version = "2.5.8", features = ["serde"] }

# Storage
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# Auth, SSH and crypto
webauthn-rs = "=0.5.5"
# Direct dependency only to turn on its `vendored` feature (webauthn-rs links it).
openssl = "0.10.81"
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "std", "getrandom"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pkcs8", "pem", "zeroize"] }
ssh-agent-lib = "0.6.0"
# SSH relay: server for agents, client to targets. The aws-lc-rs crypto
# backend (already in the tree through rustls). `rsa` lets the relay verify
# targets' pinned RSA host keys (SHA-2 signatures; public-key operations
# only: warden holds no RSA private key). No DSA, no compression.
russh = { version = "=0.64.1", default-features = false, features = ["aws-lc-rs", "rsa"] }
sha2 = "0.11.1"
zeroize = "1.9.1"
subtle = "2.6.1"
secrecy = "0.10.3"
getrandom = "0.4.3"
base64 = "0.23.1"
# PEM decoding and X.509 trust-anchor parsing for pinned API CAs; the same
# crates rustls (via reqwest) already uses, so the check matches what the
# outbound TLS client will accept.
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
hex = "0.4.3"

# HTML and CLI
maud = { version = "0.27.0", features = ["axum"] }
clap = { version = "4.6.7", features = ["derive"] }
# Keychain access: keyring-core with the macOS store linked directly (the
# `keyring` facade would also pull Linux/Windows stores, including the
# unmaintained zbus stack).
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
rpassword = "7.5.4"
jiff = "0.2.38"
toml = "1.1.8"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs"] }
dirs = "7.0.0"

# Serialization, errors, logging
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Test-only
wiremock = "0.6.5"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = { version = "0.1.5", features = ["channel"] }
proptest = "1.12.0"
# Reference encoder for the redaction tests.
percent-encoding = "2.3.2"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
# HTTPS test upstream for the proxy: a throwaway CA and leaf certificate, and
# a TLS listener (aws-lc-rs, the provider reqwest's rustls already uses).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
