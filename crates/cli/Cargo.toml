[package]
name = "warden-broker-cli"
description = "Command-line client for the warden approval broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "warden"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
jiff.workspace = true
reqwest.workspace = true
rpassword.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
ssh-agent-lib.workspace = true
ssh-key.workspace = true
tokio.workspace = true
toml.workspace = true
unicode-properties.workspace = true
url.workspace = true
warden-broker-proto.workspace = true
zeroize.workspace = true

# The agent key lives in the macOS Keychain. Elsewhere only the
# WARDEN_AGENT_KEY environment variable is supported.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
keyring-core.workspace = true

[dev-dependencies]
warden-broker = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
rustix = { workspace = true, features = ["net"] }
