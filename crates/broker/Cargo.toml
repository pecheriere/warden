[package]
name = "warden-broker"
description = "Self-hosted approval broker server for warden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "warden-server"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Build OpenSSL from source and link it statically, so the container image
# needs no system libssl (webauthn-rs links OpenSSL).
vendored-openssl = ["dep:openssl", "openssl/vendored"]
# Test helpers (fake clock and notifiers) for this crate's integration tests.
testkit = [
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:percent-encoding",
    "dep:rcgen",
    "dep:tempfile",
    "dep:tokio-rustls",
    "dep:tower",
    "dep:webauthn-authenticator-rs",
]
# The private parsing steps of signed requests, for the fuzz targets in `fuzz/`.
# Adds no dependency, and nothing that ships enables it.
fuzzing = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
http.workspace = true
reqwest.workspace = true
russh.workspace = true
rustix.workspace = true
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
# ECDSA P-256 signing keys (Secure Enclave, TPM, PIV) are parsed by `ssh-key`
# and verified with `p256` directly, see `signed.rs`. `ssh-key`'s own `p256`
# feature must stay off: it pulls in crypto-bigint 0.5 (RUSTSEC-2026-0387).
p256.workspace = true
ssh-key = { workspace = true, features = ["ed25519", "getrandom"] }
ssh-encoding.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
warden-broker-proto.workspace = true
webauthn-rs.workspace = true
maud.workspace = true
zeroize.workspace = true
openssl = { workspace = true, optional = true }
# Optional: only for the testkit feature (in-process test broker, soft passkey).
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
webauthn-authenticator-rs = { workspace = true, optional = true }

[dev-dependencies]
# Enables the testkit feature for this crate's own integration tests.
warden-broker = { workspace = true, features = ["testkit"] }
http-body-util.workspace = true
tower.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true
percent-encoding.workspace = true
proptest.workspace = true
