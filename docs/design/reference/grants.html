<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Active grants · warden</title><style>
:root{--ground:#F3F6FD;--surface:#FFFFFF;--ink:#0F1E3D;--muted:#4A5A7C;--line:#DDE5F5;
--primary:#2557D6;--on-primary:#FFFFFF;--soft:#E3EBFC;--soft-ink:#1D45AB;--accent:#F5B800;
--warn-bg:#FFF1D6;--warn-ink:#7A3300;--warn-line:#C25100;--deny:#B42318;--fp-bg:#F7F9FF}
html.dark{--ground:#0B1530;--surface:#142348;--ink:#EAF0FF;--muted:#A5B4D8;--line:#22346A;
--primary:#8FB0FF;--on-primary:#0B1530;--soft:#1B2D5C;--soft-ink:#C9D7FF;
--warn-bg:#3A2306;--warn-ink:#FFD08A;--warn-line:#E08A2C;--deny:#FF8A80;--fp-bg:#101D40}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 20px;
background:var(--surface);border-bottom:1px solid var(--line)}
header .mascot{width:38px;height:38px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.03em}
nav{margin-left:auto;display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;font-weight:600;padding:10px 12px;border-radius:10px}
nav a[aria-current]{color:var(--soft-ink);background:var(--soft)}
.menu{display:none;margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
background:transparent;color:var(--ink);align-items:center;justify-content:center}
main{max-width:560px;margin:0 auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px}
main.wide{max-width:920px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
background:var(--soft);color:var(--soft-ink);font-size:13px;font-weight:600}
h1{margin:0;font-size:29px;line-height:1.12;letter-spacing:-.025em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;
display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px}
.who{font-size:17px;font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;word-break:break-all}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;
font-size:14px;font-weight:700;border:1.5px solid}
.readonly{background:var(--soft);color:var(--soft-ink);border-color:var(--primary)}
.modify{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.fp{border-radius:18px;padding:12px 16px;background:var(--fp-bg);border:2px dashed var(--primary);
display:flex;flex-direction:column;gap:4px}
.fp span:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(18px,6.2vw,25px);font-weight:700;letter-spacing:.06em;white-space:nowrap}
@media (min-width:600px){.fp span:last-child{font-size:clamp(18px,3.1vw,25px)}}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset legend{padding:0;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.seg label{height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.seg input{position:absolute;opacity:0}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.actions{display:grid;gap:14px}
.btns{display:grid;gap:10px}
.btn{height:54px;border-radius:14px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;
gap:10px;text-decoration:none;font-family:inherit}
.approve{border:0;background:var(--primary);color:var(--on-primary)}
.deny{border:2px solid var(--deny);background:transparent;color:var(--deny)}
.ghost{border:2px solid var(--line);background:transparent;color:var(--ink)}
.done{align-items:center;text-align:center;padding-top:48px}
.halo{width:210px;height:210px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.halo .mascot{width:160px;height:160px}
.done p{margin:0;font-size:17px;color:var(--muted)}
.done strong{color:var(--ink)}
.grant{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:start}
.grant .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.revoke{height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--deny);background:transparent;color:var(--deny);
font-weight:700;font-size:15px;font-family:inherit}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--soft-ink)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* Open foldable, tablet, desktop: two columns, the gap falls on the hinge. */
@media (min-width:600px){main.split{max-width:1040px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
column-gap:64px;align-items:start;padding-top:28px}}
@media (min-width:1000px){.btns{grid-template-columns:1fr 1fr}}
/* Short screens (folded, landscape): tighter, so Approve and Deny stay on screen. */
@media (max-height:700px){main{padding-top:10px;gap:10px}h1{font-size:23px}.col{gap:10px}.card{padding:12px;gap:10px}
.fp span:last-child{font-size:21px}.btn{height:48px}.done{padding-top:12px}.halo{width:150px;height:150px}.halo .mascot{width:112px;height:112px}}
@media (max-height:700px) and (min-width:600px){main.split{padding-top:12px}}
/* Folded and short: the decision panel and the fingerprint both fit without scrolling. */
@media (max-height:700px) and (max-width:599px){header{padding-top:6px;padding-bottom:6px}header .mascot{width:32px;height:32px}
.menu{width:40px;height:40px}main{gap:8px}.col{gap:8px}.chip{padding:4px 10px;font-size:12px}h1{font-size:21px}
.card{padding:10px 12px;gap:6px;border-radius:14px}.field{gap:1px}.who{font-size:15px}.card span:not(.label):not(.badge),.card code{font-size:14px}
.badge{padding:3px 8px;font-size:13px}.fp{padding:8px 12px;border-radius:14px}.seg label{height:40px}
.actions{gap:8px;padding-top:8px}.btn{height:46px}fieldset legend{margin-bottom:4px}}
@media (max-height:560px) and (min-width:600px){main.done{display:grid;grid-template-columns:auto 1fr;column-gap:40px;text-align:left;
align-items:center;max-width:820px}main.done .halo{grid-row:span 4}main.done .chip{align-self:start!important;justify-self:start}}
@media (max-width:719px){nav{display:none}.menu{display:inline-flex}}
/* Narrow screens: Approve and Deny stay pinned at the bottom, the details scroll above. */
@media (max-width:599px){body{display:flex;flex-direction:column}main.split{flex:1;width:100%}main.split>.col:last-child{flex:1}
.actions{position:sticky;bottom:0;margin:auto -20px -28px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));gap:10px;
background:var(--surface);border-top:1px solid var(--line)}}
