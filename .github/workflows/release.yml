name: release

# Publishes ghcr.io/pecheriere/warden:<version> for a `v*` tag on main, after the
# full CI and the dependency age check pass. Each platform builds on a native
# runner (the Dockerfile compiles in the target architecture) and pushes by
# digest; `merge` joins the two into one multi-arch image and attaches a
# build-provenance attestation, verifiable with
#   gh attestation verify oci://ghcr.io/pecheriere/warden:<version> --owner pecheriere
#
# It also builds the `warden` CLI on native runners, attests the archives, and
# leaves them on a draft GitHub release. The workflow never publishes that draft:
# the owner does, once the run has finished (see "Releases" in AGENTS.md). This
# repository has immutable releases, so a published release cannot gain files,
# and they must be on the draft first.

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pecheriere/warden

jobs:
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the tag to match the workspace version
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  crate-age:
    needs: on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests check Cargo.lock against their base, but a push straight to
      # main skips that, so every version added since the previous release is
      # checked again here. The first release has no previous tag and checks all.
      - name: Refuse crate versions published less than 7 days ago
        run: |
          if [ -z "$(git tag --list 'v[0-9]*' --merged HEAD^)" ]; then
            python3 -I .github/scripts/crate_age.py --no-base
          else
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)
            python3 -I .github/scripts/crate_age.py --base "$previous"
          fi

  ci:
    needs: on-main
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [on-main, crate-age, ci]
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No cache-from: pull request builds write to that cache, and an entry
          # from one must not be able to reach a published image.
          no-cache: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > "digest-${{ matrix.slug }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: digest-${{ matrix.slug }}
          retention-days: 1

  cli:
    needs: [on-main, crate-age, ci]
    name: cli (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # This job compiles dependencies and runs their build scripts, so it holds
    # neither the attestation identity nor write access to the release. Like the
    # image, it builds with no cache: pull request builds write to the cache, and
    # an entry from one must not be able to reach a published binary.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: linux-amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99"
      # In the checkout, so the target lands on the toolchain rust-toolchain.toml
      # selects, which the action's `targets` input does not reach.
      - name: Add the build target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # The musl targets link everything statically, aws-lc's C code included,
      # which needs a C compiler for musl.
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and pack the CLI
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/package-cli.sh "$TARGET" "$PLATFORM" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  cli-attest:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  merge:
    # Waits for the CLI too, so that no version gets its image tag unless its
    # binaries built.
    needs: [build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      - id: manifest
        name: Create the multi-arch image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}@$(cat digest-amd64)" "${IMAGE}@$(cat digest-arm64)"
          first_tag=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  draft-release:
    # Last, so a draft means that everything in this run succeeded. The only job
    # with write access to the repository: it runs no code from the build, only
    # gh, and it attaches files to a draft that nobody can download until the
    # owner publishes it.
    needs: [merge, cli-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Take the release notes from the changelog
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME: write the notes on the draft"
          fi
      # A rerun finds the draft of the failed attempt and replaces its files. A
      # published release is immutable, so that case stops here.
      - name: Create the draft release, with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
