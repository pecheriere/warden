name: release

# Publishes ghcr.io/pecheriere/warden:<version> for a `v*` tag on main, after the
# full CI and the dependency age check pass. Each platform builds on a native
# runner (the Dockerfile compiles in the target architecture) and pushes by
# digest; `merge` joins the two into one multi-arch image and attaches a
# build-provenance attestation, verifiable with
#   gh attestation verify oci://ghcr.io/pecheriere/warden:<version> --owner pecheriere
#
# It also builds the `warden` CLI, `warden-server` and the local demo on native
# runners, attests the archives, and leaves them on a draft GitHub release. They build
# in that order, the crates each adds run only after the one before is attested, and
# each is attested separately. The image is attested before the server and demo build.
# The demo is never in the image, and its archive is named as a demo. If a later step
# fails, what came before exists but there is no draft: the last job says so. Rerun
# the failed jobs. The workflow never publishes that draft:
# the owner signs its manifest with scripts/sign-release.sh, using a key that is
# not on GitHub, and then publishes it (see "Releases" in AGENTS.md). This
# repository has immutable releases, so a published release cannot gain files,
# and they must be on the draft first.

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pecheriere/warden

jobs:
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the tag to match the workspace version
        run: |
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  crate-age:
    needs: on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests check Cargo.lock against their base, but a push straight to
      # main skips that, so every version added since the previous release is
      # checked again here. The first release has no previous tag and checks all.
      - name: Refuse crate versions published less than 7 days ago
        run: |
          if [ -z "$(git tag --list 'v[0-9]*' --merged HEAD^)" ]; then
            python3 -I .github/scripts/crate_age.py --no-base
          else
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)
            python3 -I .github/scripts/crate_age.py --base "$previous"
          fi

  ci:
    needs: on-main
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [on-main, crate-age, ci]
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The same BuildKit as repeatable-build.yml: a different version can
          # compress layers differently, which changes the image's digest.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The commit's time replaces the build's in the image, so that rebuilding the
      # tag gives the same image (docs/reproducing-builds.md).
      - id: epoch
        name: Use the commit's time for the image
        run: printf 'epoch=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # No cache-from: pull request builds write to that cache, and an entry
          # from one must not be able to reach a published image.
          no-cache: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > "digest-${{ matrix.slug }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: digest-${{ matrix.slug }}
          retention-days: 1

  cli:
    needs: [on-main, crate-age, ci]
    uses: $/.github/workflows/build-archives.yml
    with:
      product: cli
    permissions:
      contents: read

  attest-cli:
    # Attests the CLI archives before the demo's release build starts, so that a
    # change made after this job is unattested. This does not cover anything earlier:
    # the `ci` job already ran every workspace crate in this run, the demo's included
    # (see "Not covered yet" in docs/verifying-releases.md). Reads the builds'
    # artifacts unmerged, and attests in the same job as the check, with no download
    # in between. It builds nothing. Its digests are the record of what was attested:
    # a job output, which another job's artifact token cannot change.
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-cli-*
          path: "${{ runner.temp }}/artifacts"
      - name: Check each artifact holds only its own archive
        run: python3 -I .github/scripts/collect_archives.py collect cli "$RUNNER_TEMP/artifacts" dist
      - id: sums
        name: Record the digests
        run: |
          {
            echo 'sums<<END_OF_SUMS'
            (cd dist && sha256sum -- *.tar.gz)
            echo END_OF_SUMS
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-cli
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  merge:
    # Waits for the CLI too, so that no version gets its image tag unless its
    # binaries built and were attested.
    needs: [build, attest-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      - id: manifest
        name: Create the multi-arch image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}@$(cat digest-amd64)" "${IMAGE}@$(cat digest-arm64)"
          first_tag=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  server:
    # After the CLI's attestation and the image's: the server's crates are more than
    # the CLI's, so a file replaced from here on is unattested and refused. Linux only.
    needs: [merge, attest-cli]
    uses: $/.github/workflows/build-archives.yml
    with:
      product: server
      matrix: >-
        {"include": [
          {"platform": "linux-amd64", "target": "x86_64-unknown-linux-musl", "runner": "ubuntu-24.04"},
          {"platform": "linux-arm64", "target": "aarch64-unknown-linux-musl", "runner": "ubuntu-24.04-arm"}
        ]}
    permissions:
      contents: read

  attest-server:
    # A separate attestation, of server-named files only, for the same reason as
    # attest-demo below.
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-server-*
          path: "${{ runner.temp }}/artifacts"
      - name: Check each artifact holds only its own archive
        run: python3 -I .github/scripts/collect_archives.py collect server "$RUNNER_TEMP/artifacts" dist
      - id: sums
        name: Record the digests
        run: |
          {
            echo 'sums<<END_OF_SUMS'
            (cd dist && sha256sum -- *.tar.gz)
            echo END_OF_SUMS
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/warden-server-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-server
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  demo:
    # Last of the builds. Any job that runs dependencies could replace another job's
    # artifact with a stolen runner token. By now the other archives and the image are
    # attested, so a file replaced from here on would be unattested, and the draft job
    # and scripts/sign-release.sh refuse it. `ci` must stay before attestation, so that
    # nothing is published or attested until the tests pass, which leaves the gap
    # "Not covered yet" in docs/verifying-releases.md describes.
    needs: [merge, attest-cli, attest-server]
    uses: $/.github/workflows/build-archives.yml
    with:
      product: demo
    permissions:
      contents: read

  attest-demo:
    # A separate attestation, of demo-named files only. So the demo's build can get
    # its own archive attested but no file under another name, and
    # scripts/sign-release.sh compares names as well as digests.
    needs: demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-demo-*
          path: "${{ runner.temp }}/artifacts"
      - name: Check each artifact holds only its own archive
        run: python3 -I .github/scripts/collect_archives.py collect demo "$RUNNER_TEMP/artifacts" dist
      - id: sums
        name: Record the digests
        run: |
          {
            echo 'sums<<END_OF_SUMS'
            (cd dist && sha256sum -- *.tar.gz)
            echo END_OF_SUMS
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/warden-demo-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-demo
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft-release:
    # Last, so a draft means that everything in this run succeeded. The only job
    # with write access to the repository: it runs no code from the build, only
    # gh, and it attaches files to a draft that nobody can download until the
    # owner publishes it.
    needs: [merge, attest-cli, attest-server, attest-demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: attested-*
          merge-multiple: true
          path: dist
      # An artifact can be replaced after the job that uploaded it, so what counts
      # is what the attesting jobs recorded: exactly these files with these digests.
      - name: Refuse anything but the attested archives
        env:
          CLI_SUMS: ${{ needs.attest-cli.outputs.sums }}
          SERVER_SUMS: ${{ needs.attest-server.outputs.sums }}
          DEMO_SUMS: ${{ needs.attest-demo.outputs.sums }}
        run: |
          expected=$(printf '%s\n%s\n%s\n' "$CLI_SUMS" "$SERVER_SUMS" "$DEMO_SUMS" | LC_ALL=C sort)
          found=$(cd dist && sha256sum -- * | LC_ALL=C sort)
          if [ -z "$CLI_SUMS" ] || [ -z "$SERVER_SUMS" ] || [ -z "$DEMO_SUMS" ] \
            || [ "$found" != "$expected" ]; then
            echo "::error::the archives to release are not the ones that were attested"
            diff <(echo "$expected") <(echo "$found") || true
            exit 1
          fi
      - name: Take the release notes from the changelog
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME: write the notes on the draft"
          fi
          printf '\n**The archives with `demo` in their name are a demo and are not secure for real use.** [What they are for](https://github.com/%s/blob/%s/docs/demo.md).\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"
      # A rerun finds the draft of the failed attempt and replaces its files. A
      # published release is immutable, so that case stops here.
      - name: Create the draft release, with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            # A manifest signed before this rerun may no longer match the archives.
            # Removing it means that publishing too early gives no manifest at
            # all, rather than a wrong one.
            stale=$(gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[].name | select(endswith("-SHA256SUMS") or endswith("-SHA256SUMS.sig"))')
            for name in $stale; do
              gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
            done
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  report-incomplete:
    # The image and the attestations cannot be taken back, so a later failure leaves
    # the release half done. Say exactly how far it got.
    needs: [build, cli, attest-cli, merge, server, attest-server, demo, attest-demo, draft-release]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Say what exists and what does not
        env:
          IMAGE_RESULT: ${{ needs.merge.result }}
          CLI_RESULT: ${{ needs.attest-cli.result }}
          SERVER_RESULT: ${{ needs.attest-server.result }}
          DEMO_RESULT: ${{ needs.attest-demo.result }}
          DRAFT_RESULT: ${{ needs.draft-release.result }}
        run: |
          {
            echo '## This release did not finish'
            echo
            echo "- Image pushed and attested: $IMAGE_RESULT"
            echo "- CLI archives attested: $CLI_RESULT"
            echo "- Server archives attested: $SERVER_RESULT"
            echo "- Demo archives attested: $DEMO_RESULT"
            echo "- Draft release: $DRAFT_RESULT"
            echo
            echo 'Do not publish anything from this run. Without a draft there is nothing to'
            echo 'sign. Rerun the failed jobs. If it says the archives are not the ones that'
            echo 'were attested, treat that as a possible compromise and investigate first.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the release did not finish: see this run's summary"
          exit 1
