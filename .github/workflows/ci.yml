name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # The budgets are listed in AGENTS.md: a change that needs more raises them
    # there, with the owner's agreement.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      # Only main writes the cache, so pull requests cannot evict main's entries
      # or plant one that main would read; they restore main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A prebuilt binary, checked against the hash in the action's manifest at this
      # commit, and nothing else: no fallback to building or another source.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      # Only the tests' own unprivileged sshd may accept logins: the system
      # one is stopped before the runner account gets a password below.
      - name: Install OpenSSH
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server openssh-client
          sudo systemctl disable --now ssh.socket ssh.service
          if ss -Hltn 'sport = :22' | grep -q .; then
            echo "something still listens on port 22" >&2
            exit 1
          fi
      # The relay's password-target tests log in to a throwaway sshd as the
      # runner account, checked through PAM: give it a random password.
      - name: Give the runner account a login password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "$USER:$password" | sudo chpasswd
          echo "WARDEN_TEST_LOGIN_PASSWORD=$password" >> "$GITHUB_ENV"
      # A local-backend test needs a real bind mount of one file, and mounting
      # needs root.
      - name: Bind-mount a single file
        run: |
          mounted="$(mktemp -d)"
          printf 'policy\n' > "$mounted/source.toml"
          chmod 600 "$mounted/source.toml"
          touch "$mounted/mounted.toml"
          sudo mount --bind "$mounted/source.toml" "$mounted/mounted.toml"
          echo "WARDEN_TEST_BIND_MOUNT_SOURCE=$mounted/source.toml" >> "$GITHUB_ENV"
          echo "WARDEN_TEST_BIND_MOUNTED_FILE=$mounted/mounted.toml" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - name: Refuse a stale fuzz/Cargo.lock
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Refuse reqwest decompression features
        run: scripts/check-no-reqwest-decompression.sh
      - name: Refuse the demo in anything that ships
        run: scripts/check-demo-not-shipped.sh
      - name: Test the release signing script
        run: scripts/test-sign-release.sh
      - name: Refuse an OpenSSL out of support
        run: python3 -I .github/scripts/openssl_support.py
      # The build below takes over a minute, so main keeps it in the cache.
      # The key changes with the pin and the build script, and the script keeps a
      # restored build only when its stamp names the pinned tarball's hash, the
      # target and the script's own hash; otherwise it builds again. Only main
      # writes the entry, so a pull request cannot plant one.
      - name: Restore the pinned OpenSSL
        id: openssl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/openssl-pin.env', 'scripts/build-openssl.sh') }}
      # So that the tests run against the OpenSSL the server ships with.
      - name: Build the pinned OpenSSL
        run: |
          scripts/build-openssl.sh "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/openssl"
          echo "OPENSSL_DIR=$RUNNER_TEMP/openssl" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "WARDEN_OPENSSL_PINNED=1" >> "$GITHUB_ENV"
      - name: Save the pinned OpenSSL
        if: github.ref == 'refs/heads/main' && steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # nextest runs the test binaries in parallel and lists every failure
      # (.config/nextest.toml: no fail-fast, no retries); it does not run doctests.
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --doc --workspace --all-features --locked
      - name: Build the documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    # Measures and reports, and fails below 80% of lines (#97). On pull requests
    # and main only: a release does not wait for it.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      # Test helpers, which never ship, are not code to cover.
      COVERAGE_IGNORE: crates/broker/src/testkit|/tests\.rs$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99"
      # In the checkout, so the component lands on the toolchain
      # rust-toolchain.toml selects, as the binaries job does for its target.
      - name: Add llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      # Only main writes the cache, so pull requests cannot evict main's entries
      # or plant one that main would read; they restore main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # From crates.io at a fixed version and with its own lockfile. Dependabot
      # does not see this version: raise it by hand, to a release at least 7
      # days old.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      # A prebuilt binary, checked against the hash in the action's manifest at this
      # commit, and nothing else: no fallback to building or another source.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      # The same setup as the check job, for the Linux-only relay tests: they
      # fail without it, and the number means little without them. Keep the two
      # in step. A shared composite action cannot hold it: zizmor refuses a
      # GITHUB_ENV write there, where it cannot see the workflow's triggers.
      - name: Install OpenSSH
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server openssh-client
          sudo systemctl disable --now ssh.socket ssh.service
          if ss -Hltn 'sport = :22' | grep -q .; then
            echo "something still listens on port 22" >&2
            exit 1
          fi
      - name: Give the runner account a login password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "$USER:$password" | sudo chpasswd
          echo "WARDEN_TEST_LOGIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Bind-mount a single file
        run: |
          mounted="$(mktemp -d)"
          printf 'policy\n' > "$mounted/source.toml"
          chmod 600 "$mounted/source.toml"
          touch "$mounted/mounted.toml"
          sudo mount --bind "$mounted/source.toml" "$mounted/mounted.toml"
          echo "WARDEN_TEST_BIND_MOUNT_SOURCE=$mounted/source.toml" >> "$GITHUB_ENV"
          echo "WARDEN_TEST_BIND_MOUNTED_FILE=$mounted/mounted.toml" >> "$GITHUB_ENV"
      - name: Run the tests with coverage
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-report
      # An explicit bash has pipefail on, so a broken report fails through the tee.
      - name: Report coverage
        shell: bash
        run: |
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" \
            --json --summary-only --output-path "$RUNNER_TEMP/coverage.json"
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" \
            --lcov --output-path "$RUNNER_TEMP/coverage.lcov"
          python3 -I .github/scripts/coverage_summary.py "$RUNNER_TEMP/coverage.json" \
            --root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"
      # Kept on GitHub, for finding the gaps line by line; nothing goes to a
      # third party.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: ${{ runner.temp }}/coverage.lcov
          if-no-files-found: error
          retention-days: 14
      # After the report and the artifact, so a failure can be read from them.
      # Lines stand in for the statements of the OpenSSF criterion, which
      # llvm-cov does not count.
      - name: Fail below the coverage target
        run: |
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" \
            --summary-only --fail-under-lines 80

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      # The fuzz crate is its own workspace, with its own Cargo.lock.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check

  crate-age:
    # Compares Cargo.lock with the PR's base, so it only runs on pull requests.
    # Nothing stops a push straight to main from skipping it, so the release
    # workflow runs the same check against the previous release tag before it
    # publishes anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false
      - name: Lint and test the CI scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements-lint.txt
          "$RUNNER_TEMP/lint/bin/ruff" check .github/scripts
          "$RUNNER_TEMP/lint/bin/ruff" format --check .github/scripts
          python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Refuse crate versions published less than 7 days ago
        run: python3 -I .github/scripts/crate_age.py --base HEAD^1

  binaries:
    # The binaries a release attaches, built the same way, so that a build that
    # stops linking statically fails here rather than on a release tag. No
    # cache, like the release build. Each binary builds on its own runner.
    name: ${{ matrix.product }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # One budget for every product: the demo on macOS is the slowest.
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: cli
            platform: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - product: cli
            platform: linux-amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - product: cli
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - product: demo
            platform: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - product: demo
            platform: linux-amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - product: demo
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - product: server
            platform: linux-amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - product: server
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99"
      # In the checkout, so the target lands on the toolchain rust-toolchain.toml
      # selects, which the action's `targets` input does not reach.
      - name: Add the build target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # The musl targets link everything statically, aws-lc's C code included,
      # which needs a C compiler for musl.
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and pack the binary
        env:
          PRODUCT: ${{ matrix.product }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/package-binary.sh "$PRODUCT" "$TARGET" "$PLATFORM" dist
      - name: Check what the archive holds
        env:
          PRODUCT: ${{ matrix.product }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          file=$(python3 -I .github/scripts/collect_archives.py name "$PRODUCT" "$PLATFORM")
          python3 -I .github/scripts/collect_archives.py check "$PRODUCT" "$PLATFORM" "dist/$file"
      # The release makes these from its attested archives, in the packages job.
      - name: Make the CLI's packages, and install them in clean containers
        if: matrix.product == 'cli' && runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sudo apt-get update && sudo apt-get install -y rpm cpio
          file=$(python3 -I .github/scripts/collect_archives.py name cli "$PLATFORM")
          scripts/package-linux.sh "$PLATFORM" "dist/$file" "$RUNNER_TEMP/packages"
          scripts/test-linux-packages-docker.sh "$PLATFORM" "$RUNNER_TEMP/packages"
      - name: Run the server under the systemd unit
        if: matrix.product == 'server'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          file=$(python3 -I .github/scripts/collect_archives.py name server "$PLATFORM")
          tar -xzf "dist/$file" -C "$RUNNER_TEMP"
          scripts/test-systemd-unit-docker.sh "$RUNNER_TEMP/${file%.tar.gz}/warden-server"

  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # A tar rather than type=local: only its entries keep the image's owners.
          outputs: type=tar,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.platform }}
          # Written only from main, like the other caches: pull requests read it.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.platform) || '' }}
      - name: Check the owner and mode of /data in the built image
        run: |
          entry=$(tar --numeric-owner --no-recursion -tvf "$RUNNER_TEMP/image.tar" data/)
          read -r mode owner _ <<< "$entry"
          if [ "$mode" != "drwx------" ] || [ "$owner" != "65532/65532" ]; then
            echo "::error::/data is $mode $owner in the image, not drwx------ 65532/65532"
            exit 1
          fi
      # The demo's startup banner is in its binary, so this also catches the
      # demo linked into warden-server under another name.
      - name: Refuse the demo in the built image
        run: |
          image="$RUNNER_TEMP/image"
          mkdir "$image"
          tar -xf "$RUNNER_TEMP/image.tar" -C "$image"
          test -x "$image/warden-server"
          if find "$image" -name '*demo*' | grep .; then
            echo "::error::the image contains the demo"
            exit 1
          fi
          if grep -q 'WARDEN DEMO' "$image/warden-server"; then
            echo "::error::warden-server contains the demo"
            exit 1
          fi

  # What a pull request waits for in this workflow: from the start of the run to
  # the last required check here, runner queue included. Jobs here do not wait on
  # each other, so each job's own time is already bounded by its timeout-minutes;
  # this adds the queue. It is not a required check: it waits for the binaries
  # that are not required as well, and a slow queue is not the change's doing.
  # The table it writes tells a slow queue from a slow job. The checks of other
  # workflows (dco, zizmor, dependency-review, CodeQL) are not in it: a job can
  # only wait for jobs of its own workflow.
  critical-path:
    needs: [check, deny, crate-age, binaries, image]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to read this run's job times
      contents: read # to check out ci_time.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the names in step with the required checks of the main branch's
      # ruleset that this workflow runs.
      - name: Fail over 10 minutes to the required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          attempt="repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT"
          gh api "$attempt" > "$RUNNER_TEMP/run.json"
          gh api --paginate "$attempt/jobs" --jq '.jobs[]' > "$RUNNER_TEMP/jobs.jsonl"
          python3 -I .github/scripts/ci_time.py --budget-minutes 10 \
            --run "$RUNNER_TEMP/run.json" --jobs "$RUNNER_TEMP/jobs.jsonl" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --require check --require deny --require crate-age \
            --require "cli (linux-amd64)" --require "cli (linux-arm64)" \
            --require "cli (macos-arm64)" \
            --require "image (linux/amd64)" --require "image (linux/arm64)"

  # A red main fails every pull request that builds on it, so say so at once:
  # keep one issue open while main's CI fails. It links the run, which holds the
  # details. Not on a release, which calls this workflow for a tag.
  report-red-main:
    needs: [check, coverage, deny, binaries, image]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # to open or comment on the one issue
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          title="CI failed on main"
          number=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing at $COMMIT: $RUN_URL"
          else
            gh issue create --title "$title" --body "Failed at $COMMIT: $RUN_URL

          Fix main before merging anything else (AGENTS.md), and close this issue once main's CI passes."
          fi
