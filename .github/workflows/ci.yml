name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Only the tests' own unprivileged sshd may accept logins: the system
      # one is stopped before the runner account gets a password below.
      - name: Install OpenSSH
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server openssh-client
          sudo systemctl disable --now ssh.socket ssh.service
          if ss -Hltn 'sport = :22' | grep -q .; then
            echo "something still listens on port 22" >&2
            exit 1
          fi
      # The relay's password-target tests log in to a throwaway sshd as the
      # runner account, checked through PAM: give it a random password.
      - name: Give the runner account a login password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "$USER:$password" | sudo chpasswd
          echo "WARDEN_TEST_LOGIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - name: Refuse reqwest decompression features
        run: scripts/check-no-reqwest-decompression.sh
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Build the documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  crate-age:
    # Compares Cargo.lock with the PR's base, so it only runs on pull requests.
    # Nothing stops a push straight to main from skipping it, so the release
    # workflow runs the same check against the previous release tag before it
    # publishes anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false
      - name: Lint and test the CI scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements-lint.txt
          "$RUNNER_TEMP/lint/bin/ruff" check .github/scripts
          "$RUNNER_TEMP/lint/bin/ruff" format --check .github/scripts
          python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Refuse crate versions published less than 7 days ago
        run: python3 -I .github/scripts/crate_age.py --base HEAD^1

  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
