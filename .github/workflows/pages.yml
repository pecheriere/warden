name: pages

# Publishes the landing page in site/ to GitHub Pages. It is static: nothing is
# built, the folder is uploaded as it is. The first run needs Pages enabled with
# "GitHub Actions" as its source; workflow_dispatch is there to publish after
# that setting changes, when no commit touches site/.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer one waits rather than cancelling one that
# has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    # A manual run from another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
