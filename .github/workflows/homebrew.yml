name: homebrew

# Bumps the warden formula in pecheriere/homebrew-tap to each published release.
# Publishing the release, with its manifest signed by a key that is not on GitHub,
# is the step the owner takes; nothing here asks again.
#
# It starts when a release is published, so once its manifest is signed and its
# archives can be downloaded. `render` writes the formula with the tap's own
# scripts/formula.py, which refuses a manifest whose signature does not verify
# against the tap's copy of the release keys, and a version older than the tap's.
# `open-pr` opens a pull request on the tap with auto-merge on. The tap's required
# checks verify the formula again, with main's script and keys, and install it on
# each platform, so the pull request merges only if they pass.
#
# HOMEBREW_TAP_TOKEN, a secret of the homebrew-tap environment, which only `v*` tags
# can use, is a fine-grained token limited to the tap repository, with read
# and write access to its contents and pull requests and none to its workflows. Only
# `open-pr` sees it, and that job runs nothing from the tap: it reads the formula
# from `render` as data. When the token expires, `open-pr` fails: replace it, then
# rerun the failed jobs.

# `released` fires when a release is published, or a prerelease is promoted, and
# never for a prerelease. There is no manual trigger: `render` runs code from the
# tap, so it runs only for a release tag, whose caches nothing else reads. To retry,
# rerun the failed jobs of the release's run.
on:
  release:
    types: [released]

permissions: {}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.render.outputs.changed }}
    steps:
      - name: Take the version from the release's tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pecheriere/homebrew-tap
          ref: main
          persist-credentials: false
      - name: Render the formula from the release's signed manifest
        id: render
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -I scripts/formula.py render "$VERSION" Formula/warden.rb
          if git diff --quiet -- Formula/warden.rb; then
            echo "The tap's formula is already at $VERSION."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$RUNNER_TEMP/formula"
          cp Formula/warden.rb "$RUNNER_TEMP/formula/warden.rb"
          git rev-parse HEAD > "$RUNNER_TEMP/formula/base-commit"
          git rev-parse HEAD:Formula/warden.rb > "$RUNNER_TEMP/formula/base-blob"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.render.outputs.changed == 'true'
        with:
          name: formula
          path: ${{ runner.temp }}/formula
          retention-days: 1

  open-pr:
    needs: render
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew-tap
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: formula
      - name: Open the pull request on the tap, with auto-merge on
        env:
          VERSION: ${{ needs.render.outputs.version }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tap=repos/pecheriere/homebrew-tap
          branch=warden-$VERSION
          base_commit=$(cat formula/base-commit)
          base_blob=$(cat formula/base-blob)
          if ! [[ "$base_commit" =~ ^[0-9a-f]{40}$ && "$base_blob" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the render job's output is malformed"
            exit 1
          fi
          # 404 means there is no such branch; anything else but success is an error.
          status=$(gh api "$tap/branches/$branch" --include 2>/dev/null | awk 'NR == 1 { print $2 }' || true)
          if [ "$status" = 200 ]; then
            echo "::error::the tap already has a branch $branch: close its pull request, delete the branch, then rerun"
            exit 1
          elif [ "$status" != 404 ]; then
            echo "::error::cannot check the tap for a branch $branch (HTTP ${status:-none}): is HOMEBREW_TAP_TOKEN valid?"
            exit 1
          fi
          gh api "$tap/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_commit" > /dev/null
          gh api -X PUT "$tap/contents/Formula/warden.rb" \
            -f "message=warden $VERSION" \
            -f "content=$(base64 -w0 formula/warden.rb)" \
            -f "sha=$base_blob" \
            -f "branch=$branch" > /dev/null
          url=$(gh pr create --repo pecheriere/homebrew-tap --base main --head "$branch" \
            --title "warden $VERSION" \
            --body "Bumps the formula to warden $VERSION, rendered from the release's signed manifest by \`scripts/formula.py\`. It merges by itself once the required checks pass.

          Release: https://github.com/pecheriere/warden/releases/tag/v$VERSION
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh pr merge "$url" --auto --squash
          echo "Opened $url with auto-merge on."
