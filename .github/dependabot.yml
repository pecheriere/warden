version: 2

# Version updates wait until a release is 7 days old, the age the crate-age
# check and the action pinning rule require, and minor and patch updates come
# grouped into one pull request per ecosystem. Security updates skip the
# cooldown and come one per advisory; a crate release younger than 7 days that
# fixes an advisory still needs an entry in .github/crate-age-allow.toml.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # ssh-key, ssh-encoding and ed25519-dalek move together to their next
    # majors with ssh-key 0.7, which isn't stable yet; bumping one alone breaks
    # the build. Tracked in #60.
    ignore:
      - dependency-name: ssh-key
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: ssh-encoding
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: ed25519-dalek
        update-types: [version-update:semver-major]
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # The fuzz crate is its own workspace, with its own Cargo.lock.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # ssh-key, ssh-encoding and ed25519-dalek move together to their next
    # majors with ssh-key 0.7, which isn't stable yet; bumping one alone breaks
    # the build. Tracked in #60.
    ignore:
      - dependency-name: ssh-key
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: ssh-encoding
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: ed25519-dalek
        update-types: [version-update:semver-major]
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # The Rust image follows rust-toolchain.toml, which is bumped by hand; only
    # patch releases and digest refreshes of the pinned version come from here.
    ignore:
      - dependency-name: rust
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: docker

  # The ruff version the crate-age job lints its scripts with, pinned by hash
  # in .github/requirements-lint.txt.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
