version: 2

# Version updates wait until a release is 7 days old, the age the crate-age
# check and the action pinning rule require, and minor and patch updates come
# grouped into one pull request per ecosystem. Security updates skip the
# cooldown and come one per advisory; a crate release younger than 7 days that
# fixes an advisory still needs an entry in .github/crate-age-allow.toml.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # The Rust image follows rust-toolchain.toml, which is bumped by hand; only
    # patch releases and digest refreshes of the pinned version come from here.
    ignore:
      - dependency-name: rust
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: docker
