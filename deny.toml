[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    # The only rsa in the tree is the pre-release 0.10.0-rc.18, pinned exactly
    # by russh 0.65.0 (directly and through ssh-key 0.7.0-rc), in the broker
    # only: the CLI does not link it. The relay enables russh's "rsa" feature
    # to verify the signatures of targets' pinned RSA host keys (it negotiates
    # only rsa-sha2-256 and -512, though russh accepts a SHA-1 signature from
    # the key's holder). The advisory, the Marvin attack, is about private-key
    # operations, and the `rsa` crate is never given a private key. Warden
    # holds one RSA private key, the GitHub App's, and signs with it only
    # through aws-lc-rs. The CA, the relay's host key and targets' login keys
    # are refused unless Ed25519, and the relay accepts only Ed25519 keys from
    # agents. Agents' ECDSA P-256 request signatures are made by their own
    # ssh-agent and only verified here.
    # Remove this when russh moves to an rsa release that fixes the advisory
    # (RustCrypto/RSA merged the fixes on 2026-11-01, unreleased at the time
    # of writing), or if warden stops supporting RSA host keys on targets.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc via russh 0.65.0, broker only: public-key verification of pinned host keys only; the one RSA private key warden holds (the GitHub App) is used only through aws-lc-rs" },
    # SQLite before 3.54.0 can return uninitialised page-cache memory when it
    # opens a database with a crafted `-wal` file of another page size. The fix,
    # libsqlite3-sys 0.39, is out, but sqlx-sqlite 0.9.0 accepts only <0.38 and
    # no sqlx release takes 0.39 yet. warden opens only its own database
    # (WARDEN_DB_PATH), in a data directory it makes private, and it refuses to
    # start if others can write to that directory (private_files.rs); the demo
    # uses a fresh temporary directory, and the CLI does not link SQLite. Whoever can write the database and its `-wal` there already
    # controls the broker.
    # Remove this, and upgrade, when a sqlx release takes libsqlite3-sys 0.39
    # or later (#197).
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via sqlx 0.9.0, which accepts only libsqlite3-sys <0.38: warden opens only its own database, in a data directory others cannot write to or it refuses to start; no sqlx release takes the fixed 0.39 yet (#197)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL", # webauthn-rs links openssl
    "MPL-2.0",
    "CDLA-Permissive-2.0", # webpki-root-certs trust-anchor data (reqwest rustls verifier)
]
exceptions = [
    # LLVM's libFuzzer, linked only into the fuzz targets (fuzz/Cargo.toml).
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
    # The EFF wordlist fingerprints are written in (NOTICE). Data, not code, and
    # attribution is all it asks.
    { allow = ["CC-BY-4.0"], crate = "warden-broker-proto" },
]

[bans]
# The RustCrypto and rand ecosystems currently ship overlapping major versions
# (for example rand 0.8 via ssh-key and rand 0.9 elsewhere), so duplicates are
# reported but do not fail the build.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
